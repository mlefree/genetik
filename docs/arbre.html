<style>
:root {
  --ink: #1c1a17; --muted: #6b6259; --line: #ddd5c9;
  --bg: #f7f3ec; --card: #fffdf9; --accent: #7d5a3c; --accent-soft: #c9ab8c;
  --toile: #fffdf9; --ombre: rgba(28, 26, 23, .10);
  --warn-bg: #fdf2e2; --warn-line: #d9a441; --warn-ink: #7a5410;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #ece5da; --muted: #9c9184; --line: #3a3530;
    --bg: #17150f; --card: #201d17; --accent: #c9a87c; --accent-soft: #6d5741;
    --toile: #efe9df; --ombre: rgba(0, 0, 0, .4);
    --warn-bg: #2c2109; --warn-line: #a37d2a; --warn-ink: #e8c37a;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.55 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  display: flex; flex-direction: column;
}
header {
  padding: 18px 24px 14px; border-bottom: 1px solid var(--line); background: var(--card);
}
.site-nav { display: flex; flex-wrap: wrap; gap: 4px; margin: 0 0 12px;
  font: 650 .76rem/1 ui-sans-serif, system-ui, sans-serif; }
.site-nav a { padding: 7px 10px; border-radius: 999px; color: var(--muted); text-decoration: none; }
.site-nav a:hover, .site-nav a[aria-current="page"] { color: var(--accent); background: var(--bg); }
h1 { font-size: 1.35rem; margin: 0 0 4px; font-weight: 600; letter-spacing: -0.01em; }
.resume { color: var(--muted); font-size: 0.85rem; margin: 0; }
.avis {
  margin: 12px 0 0; padding: 10px 14px; border-radius: 4px; font-size: 0.85rem;
  background: var(--warn-bg); border: 1px solid var(--warn-line);
  border-left-width: 4px; color: var(--warn-ink); max-width: 92ch;
}
.avis b { display: block; margin-bottom: 2px; }
.barre {
  display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center;
  padding: 12px 24px; border-bottom: 1px solid var(--line); background: var(--card);
}
.champ { display: flex; align-items: center; gap: 6px; font-size: 0.82rem; color: var(--muted); }
select, input[type=text], button {
  font: inherit; font-size: 0.85rem; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px;
}
button { cursor: pointer; }
button:hover { border-color: var(--accent); color: var(--accent); }
label.bascule { display: flex; align-items: center; gap: 6px; cursor: pointer; }
.recherche { position: relative; flex: 1 1 220px; min-width: 180px; max-width: 340px; }
.recherche input { width: 100%; }
.resultats {
  position: absolute; z-index: 20; top: calc(100% + 4px); left: 0; right: 0;
  background: var(--card); border: 1px solid var(--line); border-radius: 4px;
  max-height: 320px; overflow-y: auto; box-shadow: 0 6px 20px var(--ombre);
  list-style: none; margin: 0; padding: 4px; display: none;
}
.resultats.ouvert { display: block; }
.resultats li { padding: 5px 8px; border-radius: 3px; cursor: pointer; font-size: 0.85rem; }
.resultats li:hover, .resultats li.actif { background: var(--bg); color: var(--accent); }
.resultats li small { color: var(--muted); }
main { flex: 1; display: flex; min-height: 0; }
.scene {
  flex: 1; overflow: auto; background: var(--bg); position: relative;
  cursor: grab; overscroll-behavior: contain;
}
.scene.tire { cursor: grabbing; }
.toile { padding: 32px; display: flex; align-items: flex-start; justify-content: flex-start;
  min-width: 100%; min-height: 100%; }
.cadre { flex: 0 0 auto; margin: auto; }
#arbre { display: block; background: var(--toile); border-radius: 6px;
  box-shadow: 0 2px 14px var(--ombre); transform-origin: 0 0; }
#arbre g.indi.selectionnee .border {
  stroke: var(--accent); stroke-width: 4px; filter: drop-shadow(0 2px 5px var(--ombre));
}
aside {
  width: 300px; flex: 0 0 300px; border-left: 1px solid var(--line);
  background: var(--card); overflow-y: auto; padding: 20px; display: none;
}
aside.ouvert { display: block; }
aside h2 { font-size: 1.1rem; margin: 0 0 2px; font-weight: 600; }
aside .bornes { color: var(--muted); font-size: 0.85rem; margin: 0 0 16px; }
aside dl { margin: 0 0 18px; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; }
aside dt { color: var(--muted); font-size: 0.76rem; text-transform: uppercase;
  letter-spacing: 0.04em; padding-top: 2px; }
aside dd { margin: 0; }
aside h3 { font-size: 0.76rem; text-transform: uppercase; letter-spacing: 0.04em;
  color: var(--muted); margin: 14px 0 6px; font-weight: 600; }
aside ul.liens { list-style: none; margin: 0; padding: 0; }
aside ul.liens li { margin: 0 0 3px; }
aside ul.liens button {
  border: 0; background: none; padding: 2px 0; text-align: left; width: 100%;
  color: var(--accent); text-decoration: underline; text-underline-offset: 2px;
}
aside ul.liens button:hover { color: var(--ink); }
aside .fermer { float: right; border: 0; background: none; color: var(--muted); font-size: 1.1rem; padding: 0 2px; }
.vide { margin: auto; color: var(--muted); padding: 60px 24px; text-align: center; }
@media (max-width: 760px) {
  header { padding: 12px 14px 10px; }
  .barre { padding: 10px 14px; gap: 8px 12px; }
  .barre .champ:nth-child(2), .barre .champ:nth-child(3), .bascule { display: none; }
  .recherche { order: -1; flex-basis: 100%; max-width: none; }
  aside { position: fixed; inset: auto 0 0 0; width: auto; flex: none; max-height: 55%;
    border-left: 0; border-top: 1px solid var(--line); }
}
@media print {
  header, .barre, aside { display: none; }
  .scene { overflow: visible; }
  #arbre { box-shadow: none; }
}
</style>
</head>

    <button id="moins" title="Dézoomer">−</button>

    <button id="ajuster">Ajuster</button>

  <span class="recherche">
    <input type="text" id="recherche" placeholder="Chercher une personne…" autocomplete="off">

  </span>
</div>

<main>

</main>

<script>
"use strict";
const donnees = JSON.parse(document.getElementById("donnees").textContent);
const T = globalThis.Topola;

const VUES = {
  sablier: T.HourglassChart, ascendance: T.AncestorChart,
  descendance: T.DescendantChart, parentele: T.RelativesChart, illustre: T.FancyChart,
};
const RENDUS = { detaille: T.DetailedRenderer, simple: T.SimpleRenderer };
const COULEURS = {
  generation: T.ChartColors.COLOR_BY_GENERATION,
  sexe: T.ChartColors.COLOR_BY_SEX,
  aucune: T.ChartColors.NO_COLOR,
};

const etat = { racine: donnees.racine, vue: "sablier", rendu: "detaille",
               couleurs: "generation", horizontal: false, zoom: 1 };

const scene = document.getElementById("scene");
const cadre = document.getElementById("cadre");
const svg = document.getElementById("arbre");
const fiche = document.getElementById("fiche");

// --- rendu de l'arbre ---------------------------------------------------

function dessiner(recentrer) {
  svg.replaceChildren();
  const vue = VUES[etat.vue];
  // La vue illustree impose ses cercles ; les autres acceptent les deux rendus.
  const rendu = etat.vue === "illustre" ? T.CircleRenderer : RENDUS[etat.rendu];
  let info;
  try {
    const graphe = T.createChart({
      json: donnees.topola,
      chartType: vue,
      renderer: rendu,
      svgSelector: "#arbre",
      horizontal: etat.horizontal,
      colors: COULEURS[etat.couleurs],
      animate: false,
      locale: "fr",
      indiCallback: (individu) => selectionner(individu.id, true),
    });
    info = graphe.render({ startIndi: etat.racine });
  } catch (erreur) {
    console.error("[arbre] rendu impossible", erreur);
    svg.replaceChildren();
    return;
  }
  appliquerZoom();
  mettreEnEvidence();
  if (recentrer !== false) requestAnimationFrame(() => focaliserSelection(false));
}

function appliquerZoom() {
  const largeur = Number(svg.getAttribute("width")) || 0;
  const hauteur = Number(svg.getAttribute("height")) || 0;
  svg.style.transform = "scale(" + etat.zoom + ")";
  cadre.style.width = (largeur * etat.zoom) + "px";
  cadre.style.height = (hauteur * etat.zoom) + "px";
}

function centrer() {
  scene.scrollLeft = Math.max(0, (scene.scrollWidth - scene.clientWidth) / 2);
  scene.scrollTop = Math.max(0, (scene.scrollHeight - scene.clientHeight) / 2);
}

function fichesDe(identifiant) {
  // Topola ne pose pas l'identifiant sur le groupe cliquable, mais sur le
  // clipPath qu'il contient. Un individu peut apparaitre plusieurs fois selon
  // la vue : on conserve donc toutes ses occurrences.
  return [...svg.querySelectorAll("clipPath")]
    .filter((clip) => clip.id === "clip-" + identifiant)
    .map((clip) => clip.closest("g.indi"))
    .filter(Boolean);
}

function mettreEnEvidence() {
  svg.querySelectorAll("g.indi.selectionnee").forEach((element) =>
    element.classList.remove("selectionnee"));
  fichesDe(etat.racine).forEach((element) => element.classList.add("selectionnee"));
}

function focaliserSelection(animer) {
  const cibles = fichesDe(etat.racine);
  if (!cibles.length) { centrer(); return; }
  const sceneRect = scene.getBoundingClientRect();
  // En cas d'implexe, on vise l'occurrence actuellement la plus proche du
  // centre pour eviter un saut arbitraire vers l'autre bout de l'arbre.
  const centreX = sceneRect.left + sceneRect.width / 2;
  const centreY = sceneRect.top + sceneRect.height / 2;
  const cible = cibles.reduce((meilleure, element) => {
    const rect = element.getBoundingClientRect();
    const distance = Math.hypot(rect.left + rect.width / 2 - centreX,
                                rect.top + rect.height / 2 - centreY);
    return !meilleure || distance < meilleure.distance ? { element, distance } : meilleure;
  }, null).element;
  const rect = cible.getBoundingClientRect();
  scene.scrollTo({
    left: scene.scrollLeft + rect.left + rect.width / 2 - centreX,
    top: scene.scrollTop + rect.top + rect.height / 2 - centreY,
    behavior: animer ? "smooth" : "auto",
  });
}

function zoomer(facteur) {
  etat.zoom = Math.min(3, Math.max(0.12, etat.zoom * facteur));
  appliquerZoom();
}

function ajuster() {
  const largeur = Number(svg.getAttribute("width")) || 1;
  const hauteur = Number(svg.getAttribute("height")) || 1;
  const marge = 80;
  etat.zoom = Math.min(1.5,
    (scene.clientWidth - marge) / largeur,
    (scene.clientHeight - marge) / hauteur);
  etat.zoom = Math.max(etat.zoom, 0.12);
  appliquerZoom();
  centrer();
}

// --- fiche individuelle -------------------------------------------------

function echapper(texte) {
  return String(texte).replace(/[&<>"]/g, (caractere) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[caractere]));
}

function listeLiens(titre, identifiants) {
  const connus = identifiants.filter((id) => donnees.personnes[id]);
  if (!connus.length) return "";
  const elements = connus.map((id) => {
    const personne = donnees.personnes[id];
    const bornes = personne.v ? " <small>" + echapper(personne.v) + "</small>" : "";
    return '<li><button data-id="' + echapper(id) + '">' + echapper(personne.l) + bornes + "</button></li>";
  }).join("");
  return "<h3>" + titre + '</h3><ul class="liens">' + elements + "</ul>";
}

function afficherFiche(identifiant) {
  const personne = donnees.personnes[identifiant];
  if (!personne) { fiche.classList.remove("ouvert"); return; }
  const definitions = personne.e.map((ligne) =>
    "<dt>" + echapper(ligne[0]) + "</dt><dd>" + echapper(ligne[1]) + "</dd>").join("");
  fiche.innerHTML =
    '<button class="fermer" id="fermer" title="Fermer">×</button>' +
    "<h2>" + echapper(personne.l) + "</h2>" +
    '<p class="bornes">' + echapper(personne.v || "dates inconnues") + "</p>" +
    (definitions ? "<dl>" + definitions + "</dl>" : "") +
    listeLiens("Parents", personne.par) +
    listeLiens("Union", personne.con) +
    listeLiens("Enfants", personne.enf);
  fiche.classList.add("ouvert");
  fiche.querySelector("#fermer").onclick = () => fiche.classList.remove("ouvert");
  fiche.querySelectorAll("ul.liens button").forEach((bouton) => {
    bouton.onclick = () => selectionner(bouton.dataset.id, true);
  });
}

function selectionner(identifiant, recentrerArbre) {
  if (!donnees.personnes[identifiant]) return;
  etat.racine = identifiant;
  afficherFiche(identifiant);
  if (recentrerArbre) dessiner(true);
}

// --- recherche ----------------------------------------------------------

function sansAccent(texte) {
  return texte.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
}

const indexRecherche = Object.entries(donnees.personnes).map(([id, personne]) => ({
  id, libelle: personne.l, bornes: personne.v,
  cle: sansAccent(personne.l + " " + personne.v),
}));

const champRecherche = document.getElementById("recherche");
const resultats = document.getElementById("resultats");
let positionActive = -1;

function chercher() {
  const requete = sansAccent(champRecherche.value.trim());
  if (requete.length < 2) { resultats.classList.remove("ouvert"); return; }
  const trouves = indexRecherche.filter((entree) => entree.cle.includes(requete)).slice(0, 40);
  positionActive = -1;
  if (!trouves.length) {
    resultats.innerHTML = "<li><small>Aucune personne trouvée</small></li>";
  } else {
    resultats.innerHTML = trouves.map((entree) =>
      '<li data-id="' + echapper(entree.id) + '">' + echapper(entree.libelle) +
      (entree.bornes ? " <small>" + echapper(entree.bornes) + "</small>" : "") + "</li>").join("");
  }
  resultats.classList.add("ouvert");
}

resultats.addEventListener("mousedown", (evenement) => {
  const element = evenement.target.closest("li[data-id]");
  if (!element) return;
  evenement.preventDefault();
  champRecherche.value = "";
  resultats.classList.remove("ouvert");
  selectionner(element.dataset.id, true);
});

champRecherche.addEventListener("input", chercher);
champRecherche.addEventListener("blur", () => setTimeout(() => resultats.classList.remove("ouvert"), 120));
champRecherche.addEventListener("keydown", (evenement) => {
  const elements = [...resultats.querySelectorAll("li[data-id]")];
  if (evenement.key === "Escape") { resultats.classList.remove("ouvert"); return; }
  if (!elements.length) return;
  if (evenement.key === "ArrowDown" || evenement.key === "ArrowUp") {
    evenement.preventDefault();
    positionActive = (positionActive + (evenement.key === "ArrowDown" ? 1 : -1) + elements.length) % elements.length;
    elements.forEach((element, index) => element.classList.toggle("actif", index === positionActive));
    elements[positionActive].scrollIntoView({ block: "nearest" });
  } else if (evenement.key === "Enter" && positionActive >= 0) {
    evenement.preventDefault();
    champRecherche.value = "";
    resultats.classList.remove("ouvert");
    selectionner(elements[positionActive].dataset.id, true);
  }
});

// --- deplacement a la souris -------------------------------------------

let tirage = null;
let aGlisse = false;

scene.addEventListener("pointerdown", (evenement) => {
  if (evenement.button !== 0) return;
  tirage = { x: evenement.clientX, y: evenement.clientY,
             gauche: scene.scrollLeft, haut: scene.scrollTop };
  aGlisse = false;
});

scene.addEventListener("pointermove", (evenement) => {
  if (!tirage) return;
  const dx = evenement.clientX - tirage.x;
  const dy = evenement.clientY - tirage.y;
  if (!aGlisse && Math.hypot(dx, dy) > 4) { aGlisse = true; scene.classList.add("tire"); }
  if (!aGlisse) return;
  scene.scrollLeft = tirage.gauche - dx;
  scene.scrollTop = tirage.haut - dy;
});

function finTirage() { tirage = null; scene.classList.remove("tire"); }
scene.addEventListener("pointerup", finTirage);
scene.addEventListener("pointerleave", finTirage);

// Un glisser ne doit pas etre pris pour un clic sur une personne
scene.addEventListener("click", (evenement) => {
  if (aGlisse) { evenement.stopPropagation(); evenement.preventDefault(); aGlisse = false; }
}, true);

scene.addEventListener("wheel", (evenement) => {
  if (!evenement.ctrlKey && !evenement.metaKey) return;
  evenement.preventDefault();
  zoomer(evenement.deltaY < 0 ? 1.12 : 1 / 1.12);
}, { passive: false });

// --- commandes ----------------------------------------------------------

document.getElementById("type").addEventListener("change", (evenement) => {
  etat.vue = evenement.target.value;
  document.getElementById("rendu").disabled = etat.vue === "illustre";
  dessiner(true);
});
document.getElementById("rendu").addEventListener("change", (evenement) => {
  etat.rendu = evenement.target.value; dessiner(false);
});
document.getElementById("couleurs").addEventListener("change", (evenement) => {
  etat.couleurs = evenement.target.value; dessiner(false);
});
document.getElementById("horizontal").addEventListener("change", (evenement) => {
  etat.horizontal = evenement.target.checked; dessiner(true);
});
document.getElementById("plus").addEventListener("click", () => zoomer(1.2));
document.getElementById("moins").addEventListener("click", () => zoomer(1 / 1.2));
document.getElementById("ajuster").addEventListener("click", ajuster);

dessiner(true);
afficherFiche(etat.racine);
</script>
</body>
</html>
